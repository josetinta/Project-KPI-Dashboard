<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Pulso do Impacto</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#232c7e;--blue:#0b6bc2;--sky:#29a8e0;--teal:#14a58a;--amb:#f0a33a;--org:#f26a2e;--red:#e0553f;--ink:#1c2550;--mu:#6d7898}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(circle at 20% 0,#f4f7fc,#d9e1ef 80%);font-family:Poppins,"Segoe UI",Arial,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}
#st{flex:none;width:1280px;height:740px;position:relative;transform-origin:center}
.strip{position:absolute;left:24px;right:24px;top:0;height:32px;display:flex;align-items:center;justify-content:space-between}
.strip .l,.strip .r{display:flex;align-items:center;gap:5px}
.strip button{height:21px;min-width:26px;border:1px solid #c9d3e6;background:#fff;color:#4a5a86;border-radius:7px;font:600 10px Poppins,Arial,sans-serif;cursor:pointer;padding:0 8px;transition:.15s}
.strip button:hover{border-color:var(--blue)}.strip button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.strip button.m{padding:0 5px;min-width:24px;font-size:9.5px;border-radius:6px}.strip .sp{width:1px;height:14px;background:#c3cde2;margin:0 4px}
.strip em{font-style:normal;font-size:10.5px;color:#5c6b92;margin-right:4px}
.strip a.lk{height:25px;border-radius:13px;padding:0 11px 0 5px;gap:6px;display:flex;align-items:center;font:700 10.5px Poppins,Arial,sans-serif;color:#1c2550;background:#fff;border:1px solid #c9d3e6;text-decoration:none;box-shadow:0 2px 6px rgba(35,44,126,.12);transition:.15s}.strip a.lk svg{width:17px;height:17px;flex:none}.strip a.lk:hover{transform:translateY(-1px);border-color:#0b6bc2;box-shadow:0 5px 12px rgba(35,44,126,.25)}.strip a svg{width:11px;height:11px;fill:#4a5a86}
.panel{position:absolute;left:18px;right:18px;top:34px;bottom:8px;border-radius:24px;background:#f4f7fc;background-image:radial-gradient(#dbe3f1 1px,transparent 1.200px);background-size:9px 9px;box-shadow:0 18px 44px rgba(35,44,126,.22),inset 0 0 0 1px #fff;padding:10px 12px;display:grid;grid-template-rows:70px minmax(0,1fr);gap:10px}
.hdr{border-radius:18px;background:linear-gradient(105deg,#171f66 0%,#1d4fa8 55%,#29a8e0 130%);background-size:cover;background-position:center;display:grid;grid-template-columns:minmax(340px,2.3fr) repeat(5,minmax(0,1fr)) 176px;gap:8px;padding:8px 12px;align-items:center;box-shadow:0 8px 20px rgba(35,44,126,.28);position:relative;overflow:hidden}
.hdr:before{content:"";position:absolute;right:-60px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);pointer-events:none}
.hdr>*{position:relative}
.br{display:flex;align-items:center;gap:10px}.lg{width:64px;height:50px;flex:none;cursor:pointer}.lg img{width:100%;height:100%;object-fit:contain}
.br small{display:block;font-size:8.5px;letter-spacing:2.500px;font-weight:700;color:#8fd3f7}.br h1 i{font-style:normal;background:linear-gradient(90deg,#7fd6ff,#29a8e0);-webkit-background-clip:text;background-clip:text;color:transparent}.br h1{font-size:19px;font-weight:800;color:#fff;line-height:1.05;letter-spacing:-.3px;white-space:nowrap}.br h1 b{background:linear-gradient(90deg,#fff,#a8defa);-webkit-background-clip:text;background-clip:text;color:transparent}.br p{font-size:8.3px;color:#c9dcf6;margin-top:2px;line-height:1.2}
.kp{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:13px;padding:6px 9px;display:flex;gap:7px;align-items:center;min-width:0;height:54px;backdrop-filter:blur(4px)}
.kp .ic{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);flex:none;display:flex;align-items:center;justify-content:center}.kp .ic svg{width:15px;height:15px}
.kp b{display:block;font-size:17px;font-weight:800;color:#fff;line-height:1;white-space:nowrap}.kp span{display:block;font-size:8.3px;color:#cfe2f8;margin-top:3px;line-height:1.1}
.pr{display:flex;align-items:center;gap:8px;justify-content:flex-end}.pr img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 3px rgba(255,255,255,.2),0 6px 12px rgba(0,0,0,.3)}.pr b{display:block;font-size:12.5px;color:#fff;font-weight:700;line-height:1.15}.pr a{display:block;font-size:8.2px;color:#cfe6ff;text-decoration:none;margin-top:2px;font-weight:500}.pr a:hover{text-decoration:underline}.pr span{display:block;font-size:8.5px;color:#a8defa;font-weight:500}
.bd{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr) minmax(0,.95fr) 156px;gap:10px;min-height:0}
.col{display:grid;gap:10px;min-height:0;min-width:0}
.cA{grid-template-rows:112px 190px 120px minmax(0,1fr)}.cB{grid-template-rows:246px 152px minmax(0,1fr)}.cC{grid-template-rows:128px 170px minmax(0,1fr)}.cD{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.cd{background:#fff;border:1px solid #e1e8f4;border-radius:15px;box-shadow:0 5px 16px rgba(35,44,126,.09);padding:7px 10px;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.cd h3{font-size:10.5px;font-weight:700;color:var(--ink);display:block;flex:none;line-height:1.25}.cd h3 small{display:block;font-size:8px;font-weight:500;color:var(--mu);padding-left:10px;margin-top:1px;line-height:1.2}.cd h3:before{content:"";display:inline-block;vertical-align:-1px;margin-right:6px;width:4px;height:11px;border-radius:2px;background:linear-gradient(var(--sky),var(--navy))}.cd h3 .lgd{float:right;display:flex;gap:8px;font-size:8.5px;color:var(--mu);font-weight:500}.cd h3 .lgd i{display:inline-block;width:8px;height:3px;border-radius:2px;margin-right:3px;vertical-align:middle}
.cb{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}.cb svg{width:100%;height:100%;display:block;overflow:visible}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:1;min-height:0}.g3>div{display:flex;flex-direction:column;min-height:0;min-width:0}.g3 span{text-align:center;font-size:9px;font-weight:600;color:var(--mu);line-height:1}.g3 .cb{flex:1}
.sf{transition:stroke-dashoffset 1.1s cubic-bezier(.3,1.1,.5,1)}.nd2,.pn,.bm,.mk,.pk{transition:transform 1.1s cubic-bezier(.3,1.35,.5,1)}.rg{transition:stroke-dasharray 1s}
.sbr{display:grid;gap:3px;margin-top:2px;flex:none}.sbr div{display:grid;grid-template-columns:62px 1fr 34px;gap:6px;align-items:center;font-size:8.5px;font-weight:600;color:var(--mu)}.sbr .tk{height:6px;border-radius:3px;background:#e4e9f3;overflow:hidden}.sbr .tk i{display:block;height:100%;border-radius:3px;transition:width 1s}.sbr b{font-size:10px;text-align:right}
.lgn{display:flex;justify-content:center;gap:10px;font-size:8.5px;font-weight:600;color:var(--mu);flex:none}.lgn i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.ds{display:grid;gap:4px;flex:1;align-content:center}.ds .d{display:grid;grid-template-columns:50px 1fr 36px;gap:6px;align-items:center;font-size:9px;font-weight:700;color:var(--ink);height:19px}.ds .d svg{height:17px;width:100%}.ds .d b{font:700 16px Caveat,'Segoe Print','Comic Sans MS',cursive;text-align:left;color:#1f2430}
.tb{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:1px;flex:1;min-height:0;margin-top:3px}.tb svg{width:100%;height:100%;display:block}.tb .row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(60px,.8fr) 30px 9px;gap:6px;align-items:center;font-size:8.8px;padding:2.500px 0;border-top:1px solid #edf1f8}.tb .row:first-child{border-top:0}.tb .row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}.tb .bar{height:6px;border-radius:3px;background:#e4e9f3;overflow:hidden}.tb .bar i{display:block;height:100%;border-radius:3px}.tb b{text-align:right;font-weight:700}.tb u{width:8px;height:8px;border-radius:50%;display:block}
.vd{flex:none;font-size:8.3px;font-weight:600;color:var(--mu);margin-top:3px;display:grid;gap:2px}.vd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.vd b{color:var(--ink)}.vb{color:#fff;text-align:center;font-weight:800;font-size:10px;border-radius:7px;padding:3px 0;letter-spacing:.5px}.lm{transition:opacity .9s}.slot{cursor:pointer}.slot:hover{outline:2px dashed #8fd3f7;outline-offset:2px}.hit{cursor:pointer}
</style></head><body>
